# ==========================================
# Tmux Configuration for Claude Code + Neovim
# ==========================================

# --------------------------
# Core Settings
# --------------------------
# Extended keys
set -g extended-keys on
set -g extended-keys-format csi-u

# Prefix key: Ctrl-Space
set-option -g prefix C-space
unbind C-b

# For (neo)vim
set-option -g escape-time 10
set-option -g focus-events on

# True color
set -g default-terminal "tmux-256color"
set -as terminal-features ",*:RGB"

# Mouse support for pane/window switching
set-option -g mouse on

# History for debugging output
set-option -g history-limit 100000

# Default shell: Fish
set-option -g default-shell "/run/current-system/sw/bin/fish"

# Clipboard: accept OSC52 from apps; passthrough for other escape sequences
set -g set-clipboard on
set -g allow-passthrough on

# Set terminal title
set -g set-titles on

# Use 1-based indexing
set -g base-index 1
setw -g pane-base-index 1

# Auto renumber windows on close
set -g renumber-windows on

# --------------------------
# Keybindings
# --------------------------

bind r source-file ~/.config/tmux/tmux.conf \; display "Config reloaded!"

# Pane navigation handled by vim-tmux-navigator

# Pane management (splits match Neovim's <C-w>v / <C-w>s)
bind v split-window -h -c "#{pane_current_path}"
bind s split-window -v -c "#{pane_current_path}"
bind x kill-pane

# Window management
bind c new-window -c "#{pane_current_path}"
bind & kill-window

# Vi copy mode
setw -g mode-keys vi
bind -T copy-mode-vi v send -X begin-selection
bind -T copy-mode-vi y send -X copy-selection-and-cancel

# --------------------------
# Status Bar
# --------------------------
# Left side: session name
set-option -g status-left "#[bg=default,fg=black]#[bg=black,fg=white] #S #[bg=default,fg=black]#[default] "

# Hostname text follows terminal light/dark mode (blue is dark in dayfox,
# light in duskfox). tmux asks the terminal on attach and the hooks fire on
# the reply; -o keeps the current value across config reloads.
set -goq @host_fg white
set-hook -g client-light-theme 'set -g @host_fg white ; refresh-client -S'
set-hook -g client-dark-theme 'set -g @host_fg black ; refresh-client -S'

# Right side: time, hostname
set-option -g status-right "#[bg=default,fg=black]#[bg=black,fg=white] %H:%M #[bg=black,fg=blue]#[bg=blue,fg=#{@host_fg}] #h #[bg=default,fg=blue]"

set-option -g status-style bg=default

# Message display time (1 second)
set-option -g display-time 1000

# --------------------------
# TPM (Tmux Plugin Manager)
# --------------------------
set -g @plugin "tmux-plugins/tpm"
set -g @plugin "christoomey/vim-tmux-navigator"

# Initialize TPM (keep this line at the very bottom of tmux.conf)
run "~/.config/tmux/plugins/tpm/tpm"
